<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Nikolay Pylev — TypeScript, Node.js, React and Docker developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#11152a"/>
      <stop offset="1" stop-color="#15102a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>
  <circle cx="1035" cy="70" r="190" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="1080" cy="330" r="130" fill="#22d3ee" opacity=".08" filter="url(#soft)"/>
  <path d="M0 330C220 260 390 410 620 325S985 240 1200 315V420H0Z" fill="#8b5cf6" opacity=".06"/>

  <g transform="translate(70 58)">
    <rect width="240" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="19" cy="17" r="5" fill="#a3e635"/>
    <text x="34" y="22" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="1.8">OPEN TO BUILDING</text>
  </g>

  <text x="70" y="170" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="-2">NIKOLAY</text>
  <text x="70" y="247" fill="url(#accent)" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="-2">PYLEV</text>
  <text x="74" y="292" fill="#94a3b8" font-family="Consolas,Menlo,monospace" font-size="20">web tools · automation · digital products</text>

  <g transform="translate(72 326)" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">
    <g><rect width="118" height="42" rx="21" fill="#3178c6" fill-opacity=".16" stroke="#3178c6" stroke-opacity=".55"/><text x="22" y="26" fill="#93c5fd">TYPESCRIPT</text></g>
    <g transform="translate(132)"><rect width="96" height="42" rx="21" fill="#5fa04e" fill-opacity=".16" stroke="#5fa04e" stroke-opacity=".55"/><text x="24" y="26" fill="#bef264">NODE.JS</text></g>
    <g transform="translate(242)"><rect width="84" height="42" rx="21" fill="#61dafb" fill-opacity=".14" stroke="#61dafb" stroke-opacity=".55"/><text x="22" y="26" fill="#67e8f9">REACT</text></g>
    <g transform="translate(340)"><rect width="92" height="42" rx="21" fill="#2496ed" fill-opacity=".14" stroke="#2496ed" stroke-opacity=".55"/><text x="20" y="26" fill="#7dd3fc">DOCKER</text></g>
  </g>

  <g transform="translate(845 92)" fill="none" stroke-linecap="round">
    <rect x="0" y="0" width="278" height="212" rx="22" fill="#070b14" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".14"/>
    <circle cx="26" cy="25" r="5" fill="#fb7185" stroke="none"/>
    <circle cx="44" cy="25" r="5" fill="#facc15" stroke="none"/>
    <circle cx="62" cy="25" r="5" fill="#a3e635" stroke="none"/>
    <path d="M24 58h230" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="25" y="91" fill="#22d3ee" font-family="Consolas,Menlo,monospace" font-size="17">const</text>
    <text x="80" y="91" fill="#f8fafc" font-family="Consolas,Menlo,monospace" font-size="17">builder = {</text>
    <text x="42" y="126" fill="#c4b5fd" font-family="Consolas,Menlo,monospace" font-size="16">focus:</text>
    <text x="110" y="126" fill="#a3e635" font-family="Consolas,Menlo,monospace" font-size="16">'useful',</text>
    <text x="42" y="158" fill="#c4b5fd" font-family="Consolas,Menlo,monospace" font-size="16">mode:</text>
    <text x="101" y="158" fill="#a3e635" font-family="Consolas,Menlo,monospace" font-size="16">'ship'</text>
    <text x="25" y="190" fill="#f8fafc" font-family="Consolas,Menlo,monospace" font-size="17">};</text>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="29" fill="none" stroke="url(#accent)" stroke-opacity=".35" stroke-width="2"/>
</svg>